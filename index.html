<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topgolf on the 19th</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&display=swap">
<style>
:root {
  --bg: #f3f6ef; --card: #ffffff; --fg: #16201a; --muted: #5d6b62; --line: #d6ddd2;
  --turf: #1d7a46; --turf-ink: #ffffff; --flag: #e8562a;
  --display: "Archivo Black", "Archivo", Impact, system-ui, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #101713; --card: #18221c; --fg: #eef3ea; --muted: #9eab9f; --line: #2a3a2f;
    --turf: #2f9b5c; --turf-ink: #0d1a12; --flag: #ff7a4d; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); margin: 0; padding: 28px 16px 48px; line-height: 1.5; }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 28px; }
header { display: grid; gap: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--turf); font-weight: 600; }
h1 { font-family: var(--display); font-size: clamp(34px, 9vw, 52px); line-height: .95; margin: 0; letter-spacing: -.01em; }
.date { color: var(--muted); font-size: 15px; }
form { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 20px; }
label.field { display: grid; gap: 8px; font-weight: 600; font-size: 15px; }
input[type=text] { font: inherit; font-weight: 400; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }
input[type=text]:focus { outline: 3px solid color-mix(in srgb, var(--turf) 35%, transparent); border-color: var(--turf); }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
legend { font-weight: 600; font-size: 15px; padding: 0; margin-bottom: 8px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg label { position: relative; display: block; text-align: center; padding: 12px; border-radius: 10px; border: 1.5px solid var(--line); cursor: pointer; font-weight: 600; user-select: none; transition: background .15s, border-color .15s; }
.seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.seg label:has(input:checked) { background: var(--turf); border-color: var(--turf); color: var(--turf-ink); }
.seg label:has(input:focus-visible) { outline: 3px solid color-mix(in srgb, var(--turf) 35%, transparent); }
button { font: inherit; font-weight: 600; font-size: 16px; padding: 14px; border-radius: 10px; border: 0; background: var(--flag); color: #fff; cursor: pointer; }
button:disabled { opacity: .55; cursor: default; }
button:focus-visible { outline: 3px solid color-mix(in srgb, var(--flag) 40%, transparent); }
.note { font-size: 14px; color: var(--muted); min-height: 1.2em; }
.note.ok { color: var(--turf); font-weight: 600; }
.note.err { color: var(--flag); }
section.tally { display: grid; gap: 12px; }
.tally h2 { font-family: var(--display); font-size: 20px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; }
.tally h2 span:last-child { font-size: 14px; font-family: var(--body); color: var(--muted); font-weight: 400; }
.counts { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.counts b { color: var(--fg); font-variant-numeric: tabular-nums; }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: 15px; }
th { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td.c { text-align: center; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); }
.pill.yes { background: var(--turf); color: var(--turf-ink); border-color: var(--turf); }
.empty { padding: 22px 14px; color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .seg label { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">RSVP</div>
    <h1>Topgolf on the 19th</h1>
    <div class="date">Wednesday, November 19 · let us know if you're in</div>
  </header>

  <form id="rsvp" autocomplete="off">
    <label class="field" for="name">Your name
      <input type="text" id="name" name="name" placeholder="First and last" required maxlength="80">
    </label>

    <fieldset>
      <legend>Are you coming on the 19th?</legend>
      <div class="seg">
        <label><input type="radio" name="going" value="yes" required><span>Yes, I'm in</span></label>
        <label><input type="radio" name="going" value="no"><span>Can't make it</span></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Have you been to Topgolf before?</legend>
      <div class="seg">
        <label><input type="radio" name="been" value="yes" required><span>Yes</span></label>
        <label><input type="radio" name="been" value="no"><span>First time</span></label>
      </div>
    </fieldset>

    <button type="submit" id="submit">Send my RSVP</button>
    <div class="note" id="note" aria-live="polite"></div>
  </form>

  <section class="tally">
    <h2><span>Who's in</span><span id="total"></span></h2>
    <div class="counts" id="counts"></div>
    <table>
      <thead><tr><th>Name</th><th class="c">Going</th><th class="c">Been before</th></tr></thead>
      <tbody id="rows"><tr><td colspan="3" class="empty">Loading…</td></tr></tbody>
    </table>
  </section>
</main>

<script>
(() => {
  const SUPABASE_URL = 'https://pfmdhnhvnnhyuaqfnblp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Hy-UZ3Vhsao8SAgUUl-GYA_dmQsHWR9';
  const TABLE = 'topgolf_rsvps';
  const endpoint = `${SUPABASE_URL}/rest/v1/${TABLE}`;
  const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };

  const form = document.getElementById('rsvp');
  const note = document.getElementById('note');
  const btn = document.getElementById('submit');
  const rows = document.getElementById('rows');
  const counts = document.getElementById('counts');
  const total = document.getElementById('total');

  const say = (msg, cls) => { note.textContent = msg; note.className = 'note' + (cls ? ' ' + cls : ''); };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const render = list => {
    // Keep only the latest reply per name so people can change their answer.
    const latest = new Map();
    for (const r of list) latest.set(r.name.trim().toLowerCase(), r);
    const rsvps = [...latest.values()];
    if (!rsvps.length) {
      rows.innerHTML = '<tr><td colspan="3" class="empty">No RSVPs yet. Be the first to answer above.</td></tr>';
      counts.innerHTML = ''; total.textContent = ''; return;
    }
    rsvps.sort((a, b) => (a.going === b.going ? 0 : a.going ? -1 : 1) || a.name.localeCompare(b.name));
    const going = rsvps.filter(r => r.going).length;
    const first = rsvps.filter(r => r.going && !r.been_before).length;
    total.textContent = rsvps.length + (rsvps.length === 1 ? ' reply' : ' replies');
    counts.innerHTML = `<span><b>${going}</b> going</span><span><b>${rsvps.length - going}</b> can't make it</span><span><b>${first}</b> first-timers going</span>`;
    rows.innerHTML = rsvps.map(r => `<tr>
      <td>${esc(r.name)}</td>
      <td class="c"><span class="pill ${r.going ? 'yes' : ''}">${r.going ? 'Yes' : 'No'}</span></td>
      <td class="c">${r.been_before ? 'Yes' : 'First time'}</td></tr>`).join('');
  };

  const load = async () => {
    try {
      const res = await fetch(`${endpoint}?select=name,going,been_before,created_at&order=created_at.asc`, { headers });
      if (!res.ok) throw new Error(res.status);
      render(await res.json());
    } catch {
      rows.innerHTML = '<tr><td colspan="3" class="empty">Could not load the list right now.</td></tr>';
    }
  };

  let busy = false;
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    if (busy) return;
    const fd = new FormData(form);
    const name = String(fd.get('name') || '').trim();
    if (!name || !fd.get('going') || !fd.get('been')) { say('Fill in your name and answer both questions.', 'err'); return; }
    busy = true; btn.disabled = true; say('Saving…');
    try {
      const res = await fetch(endpoint, {
        method: 'POST', headers: { ...headers, Prefer: 'return=minimal' },
        body: JSON.stringify({ name, going: fd.get('going') === 'yes', been_before: fd.get('been') === 'yes' })
      });
      if (!res.ok) throw new Error(res.status);
      say(fd.get('going') === 'yes' ? "You're on the list. See you on the 19th." : 'Got it, thanks for letting us know.', 'ok');
      await load();
    } catch {
      say('Could not save. Try again in a moment.', 'err');
    } finally { busy = false; btn.disabled = false; }
  });

  load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
